<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — HEXA CORE</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="track.js"></script></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/logo.jpg" alt=""><span>HEXA CORE</span></a><nav><a href="index.html">Store</a><a href="admin.html">Admin</a></nav></header><main class="wrap narrow"><section class="hero compact"><h1>Track Your Order</h1><p>Enter the order reference and the phone number used when ordering.</p></section><section class="panel"><form id="track-form"><label>Order reference<input id="order-id" required placeholder="Paste order reference"></label><label>Your phone number<input id="track-phone" required inputmode="tel"></label><button class="btn">Check Order</button><p id="track-message" class="message"></p></form><div id="order-result"></div></section><section class="panel" id="feedback-panel" hidden><h2>Leave Feedback</h2><form id="feedback-form"><label>Rating<select id="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Poor</option><option value="1">1 — Bad</option></select></label><label>Feedback<textarea id="feedback-text" required maxlength="1000"></textarea></label><button class="btn">Submit Feedback</button><p id="feedback-message" class="message"></p></form></section></main><footer>HEXA CORE</footer></body></html>
